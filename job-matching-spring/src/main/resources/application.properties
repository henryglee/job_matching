spring.application.name=demo

# Activate the "local" profile by default; override with SPRING_PROFILES_ACTIVE=ec2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JSON field names match the existing API_DOCUMENTATION.md contract (snake_case, same as
# the Python dict keys) without hand-written DTOs for every entity field.
spring.jackson.property-naming-strategy=SNAKE_CASE

# ── DataSource ──────────────────────────────────────────────
spring.datasource.username=${DB_USER:henry}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection Pool (HikariCP) ───────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ─────────────────────────────────────────
# Schema is owned by the existing Python/SQLAlchemy app (see JobSpy-main/jobspy/database.py);
# validate only, never let Hibernate modify it.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Timestamps are stored as UTC (the app pins the JVM to UTC in JobMatchingApplication).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── OpenAI (embeddings) ───────────────────────────────────────
openai.api-key=${OPENAI_API_KEY}
openai.embedding-model=text-embedding-ada-002
openai.embedding-dimensions=1536
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-ada-002

# ── OpenAI (chat: "Generate draft" and "Ask about your matches"; see EmailDraftGenerator, MatchChatService) ──
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-5-mini}
spring.ai.openai.chat.timeout=30s
# Per candidate, sliding hour. Each generation is a paid model call.
app.drafts.generations-per-hour=${DRAFT_GENERATIONS_PER_HOUR:10}
# "Ask about your matches" chat (MatchChatService), per candidate, sliding hour.
app.chat.messages-per-hour=${CHAT_MESSAGES_PER_HOUR:30}
# Output cap per model call for the chat (OpenAI max_completion_tokens). With a reasoning model
# (gpt-5-mini) this includes hidden reasoning, hence low reasoning effort; set
# CHAT_REASONING_EFFORT to empty if OPENAI_CHAT_MODEL is a model without that parameter.
app.chat.max-output-tokens=${CHAT_MAX_OUTPUT_TOKENS:1500}
app.chat.reasoning-effort=${CHAT_REASONING_EFFORT:low}
# Screen chat messages and Generate-draft instructions with OpenAI's (free) moderation
# endpoint before they reach the chat model (ModerationService). Fails open if it's down.
app.moderation.enabled=${AI_MODERATION_ENABLED:true}
# What-if scores from the chat or MCP (WhatIfService): one embedding call each, per candidate.
app.what-if.per-hour=${WHAT_IF_PER_HOUR:20}

# ── MCP server (email drafting tools, see mcp/EmailDraftTools) ─
# Served at /mcp. It sits behind the same JWT filter as /api/**, so clients must send
# "Authorization: Bearer <token>" from POST /login.
spring.ai.mcp.server.name=job-matching
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE

# ── AWS SES (email) ───────────────────────────────────────────
aws.region=${AWS_REGION:us-west-2}
aws.ses.sender-email=${SES_SENDER_EMAIL}

# ── JobSpy scraping microservice ─────────────────────────────
jobspy.service.url=${JOBSPY_SERVICE_URL:http://localhost:5000}

# ── JWT (replaces the Flask session cookie) ───────────────────
# JWT_SECRET must be at least 32 bytes (HS256) — generate with e.g. `openssl rand -base64 48`.
# No default: the app must fail fast rather than sign tokens with a guessable key.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Password reset ──────────────────────────────────────────
# Base URL the reset email links to; the React app owns the actual reset-password page.
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:3000/reset-password}
# React Email Drafts page. The MCP save/update tools return <this>?highlight=<draft id> so the
# candidate's AI assistant can hand them a link straight to the draft.
app.email-drafts-url=${EMAIL_DRAFTS_URL:http://localhost:3000/email-drafts}

# ── Uploads ───────────────────────────────────────────────────
# Matches app.py's MAX_CONTENT_LENGTH (16MB) for resume uploads.
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# ── CORS (job-matching-react) ─────────────────────────────────
# Comma-separated list. Default matches Vite's configured dev port (job-matching-react/vite.config.ts).
# Add the production frontend origin here once it's deployed (e.g. via CORS_ALLOWED_ORIGINS env var).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Background jobs (see BackgroundJobs) ──────────────────────
# Startup scrape of every candidate's preferred title + nightly cleanup of old jobs.
# Set BACKGROUND_JOBS_ENABLED=false on all but one instance when running several.
app.background-jobs.enabled=${BACKGROUND_JOBS_ENABLED:true}
# Spring cron (sec min hour day month weekday); app.py ran it daily at 2 AM server time.
app.cleanup.cron=0 0 2 * * *
app.cleanup.days-old=30
# Jobs that stopped accepting applications (JobExpiryService) are deleted this many days after,
# in the same nightly run, unless a candidate has an email draft for them.
app.cleanup.expired-days-old=7
# Daily re-scrape of every candidate's preferred title, so expired listings get replaced.
app.scrape.refresh-cron=0 0 3 * * *
# When each search term was last scraped (24h re-scrape limit); same format as app.py's file.
app.scrape.state-file=${SCRAPE_STATE_FILE:scrape_state.json}
